# mise ツール構成
#
# ⚠️ pnpm は必ず npm バックエンド ("npm:pnpm") でインストールすること。
#  mise のデフォルト (aqua バックエック) は pnpm 11 の Standalone SEA バイナリを
#   ダウンロードするが、mise shim との組み合わせで既知の不具合がある
#   (/.l2s/ への自己リンク解決に失敗し "Cannot find module '/.l2s/dist/pnpm.mjs'"
#    でクラッシュ)。npm バックエンドは通常の JS 実装 (node で実行) を
#   インストールするため SEA バイナリを完全に回避できる。
#   参考: https://github.com/jdx/mise/discussions/9453
#
# バージョン方針:
#   node → 24 (Node.js 最新 LTS ライン。24.x の最新パッチに自動解決。
#            2026-10-28 に Node 26 が LTS 昇格したら 26 への更新を検討)
#   pnpm → 11.24.0 (package.json の packageManager と同一に保つこと)
[tools]
node = "24"
"npm:pnpm" = "11.24.0"
