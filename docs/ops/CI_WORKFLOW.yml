name: CI

on:
  # 2026-08-29: PR ブランチで push + pull_request の二重実行を防ぐため、
  # push は main のみ (arena/** への push は PR 経由の pull_request が担う)。
  # PR の無いブランチで実行したい場合は Actions タブから workflow_dispatch。
  push:
    branches: [main]
    # ドキュメント系の変更では CI を走らせない (2026-08-29 ユーザー指示):
    # README.md / AGENT.md / .agent/** / docs/** のみのコミットはスキップ
    paths-ignore:
      - 'README.md'
      - 'AGENT.md'
      - '.agent/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENT.md'
      - '.agent/**'
      - 'docs/**'
  # Actions タブから手動実行も可能 (初回配置後の動作確認に便利)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 型・lint・ユニットテスト (最速で fail を検出する軽量ジョブ)
  # ==========================================================================
  static-checks:
    name: Type / Lint / Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version は package.json の packageManager (pnpm@11.24.0) から解決。
        # version を明示すると重複指定エラー
        # (Multiple versions of pnpm specified) で action が失敗するため書かない。
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check (main + test tsconfig)
        run: pnpm typecheck

      - name: "Biome lint (Phase 10-P5 ESLint から移行)"
        run: pnpm lint

      - name: Unit tests (vitest)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ==========================================================================
  # ビルド (production build が通ることを保証)
  # H7-5 修正: .next 成果物を artifact として保存し、E2E job で再利用する
  # ==========================================================================
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version は package.json の packageManager (pnpm@11.24.0) から解決。
        # version を明示すると重複指定エラー
        # (Multiple versions of pnpm specified) で action が失敗するため書かない。
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next / pnpm build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .cache/dropmod-build
          key: dropmod-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.mjs') }}
          restore-keys: |
            dropmod-build-${{ runner.os }}-

      - name: Build
        run: pnpm build

      # H7-5: .next 成果物を E2E job に渡す。
      # upload-artifact v4 は隠し (ドット) ディレクトリ配下を対象にできない
      # (excludeHiddenFiles により .next/** が 0 件マッチ。2026-08-27 実証) ため、
      # cache を除外して tar 化し単一ファイルとしてアップロードする。
      - name: Archive .next build output
        run: tar --exclude='.next/cache' -czf next-build.tgz .next

      - name: Upload .next build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tgz
          retention-days: 1

  # ==========================================================================
  # E2E (Playwright): push (main マージ) と手動実行 (workflow_dispatch) 時のみ
  # PR プレビューでは静的チェック優先 (2026-08-29: 手動実行対応を追加)
  # H7-5 修正: build job の .next を復元し、playwright.config.ts の webServer は
  #           `pnpm start` のみ (build を再実行しない、~2 分短縮)
  # ==========================================================================
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version は package.json の packageManager (pnpm@11.24.0) から解決。
        # version を明示すると重複指定エラー
        # (Multiple versions of pnpm specified) で action が失敗するため書かない。
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # H7-5: build job の .next を復元 (tar を展開)
      - name: Download .next build output
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Extract .next build output
        run: tar -xzf next-build.tgz

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
